[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kaffeine-dvr"
version = "0.7.0"
description = "Modern TV Guide browser, auto-record series rules scheduler, and safe Just-In-Time DVR daemon for Kaffeine."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "PlasmaDrifter" }
]
dependencies = [
    "PyQt6>=6.4.0",
]

[project.scripts]
kaffeine-dvr = "kaffeine_dvr.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["kaffeine_dvr*"]
