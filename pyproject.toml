[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kaffeine-dvr"
version = "0.8.11"
description = "Modern TV Guide browser, auto-record series rules scheduler, and safe Just-In-Time DVR daemon for Kaffeine."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "PlasmaDrifter" }
]
dependencies = [
    "PyQt6>=6.4.0",
]

[project.scripts]
kaffeine-dvr = "kaffeine_dvr.cli:main"
kaffeine-dvr-gui = "kaffeine_dvr.gui:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["kaffeine_dvr*"]

[tool.pytest.ini_options]
qt_api = "pyqt6"
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pylint.main]
extension-pkg-allow-list = ["PyQt6"]
max-line-length = 120

[tool.pylint.messages_control]
disable = [
    "invalid-name",
    "too-many-instance-attributes",
    "too-many-locals",
    "too-many-public-methods",
    "too-many-lines",
    "too-many-branches",
    "too-many-statements",
    "too-many-arguments",
    "too-many-positional-arguments",
    "duplicate-code",
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "broad-exception-caught",
]
