[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kaffeine-dvr"
version = "0.8.15"
description = "Modern TV Guide browser, auto-record series rules scheduler, and safe Just-In-Time DVR daemon for Kaffeine."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "PlasmaDrifter" }
]
dependencies = [
    "PyQt6>=6.4.0",
]

[project.scripts]
kaffeine-dvr = "kaffeine_dvr.cli:main"
kaffeine-dvr-gui = "kaffeine_dvr.gui:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["kaffeine_dvr*"]

[tool.pytest.ini_options]
qt_api = "pyqt6"
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pylint.main]
extension-pkg-allow-list = ["PyQt6"]
max-line-length = 120

[tool.pylint.messages_control]
disable = [
    "invalid-name",
    "too-many-instance-attributes",
    "too-many-locals",
    "too-many-public-methods",
    "too-many-lines",
    "too-many-branches",
    "too-many-statements",
    "too-many-arguments",
    "too-many-positional-arguments",
    "duplicate-code",
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "broad-exception-caught",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
warn_redundant_casts = true
warn_unused_ignores = false
disable_error_code = ["override", "assignment", "operator", "arg-type", "attr-defined", "method-assign", "union-attr", "call-overload", "var-annotated"]

[[tool.mypy.overrides]]
module = "kaffeine_dvr.gui"
ignore_errors = true

[tool.bandit]
exclude_dirs = ["tests", ".pytest_cache"]
skips = ["B404", "B603", "B607", "B310", "B314", "B405", "B608", "B105", "B110", "B112", "B104"]
